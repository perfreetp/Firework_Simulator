<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>烟花模拟器</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#000000" />
		<link rel="shortcut icon" type="image/png" href="./images/favicon.png" />
		<link rel="icon" type="image/png" href="./images/favicon.png" />
		<link rel="apple-touch-icon-precomposed" href="./images/favicon.png" />
		<meta name="msapplication-TileColor" content="#000000" />
		<meta name="msapplication-TileImage" content="./images/favicon.png" />
		<link href="./fonts/css.css" rel="stylesheet" />
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<!-- partial:index.partial.html -->
		<!-- SVG Spritesheet -->
		<div style="height: 0; width: 0; position: absolute; visibility: hidden">

				<symbol id="icon-show" viewBox="0 0 24 24">

				</symbol>
				<symbol id="icon-wish" viewBox="0 0 24 24">
					<path d="M12 2l2.4 5.6L20 8.3l-4.3 3.9 1.3 5.8L12 14.9 7 18l1.3-5.8L4 8.3l5.6-.7L12 2z" />

					<path d="M6 6h12v12H6z" />

					<path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />

			</svg>
		</div>
		<!-- App -->
		<div class="container">
			<div class="loading-init">
				<div class="loading-init__header">加载中</div>
				<div class="loading-init__status">正在装配烟花</div>
			</div>
			<div class="stage-container remove">
				<div class="canvas-container">
					<canvas id="trails-canvas"> </canvas>
					<canvas id="main-canvas"> </canvas>
				</div>
				<div class="controls">
					<button class="btn pause-btn" type="button" aria-label="暂停或继续">
						<svg fill="white" width="24" height="24" aria-hidden="true">
							<use href="#icon-pause" xlink:href="#icon-pause"></use>
						</svg>
					</button>
					<button class="btn sound-btn" type="button" aria-label="切换声音">
						<svg fill="white" width="24" height="24" aria-hidden="true">
							<use href="#icon-sound-off" xlink:href="#icon-sound-off"></use>
						</svg>
					</button>
					<button class="btn settings-btn" type="button" aria-label="打开设置">
						<svg fill="white" width="24" height="24" aria-hidden="true">
							<use href="#icon-settings" xlink:href="#icon-settings"></use>
						</svg>
					</button>
					<button class="btn btn--bright show-btn" type="button" aria-label="烟花秀编排">
						<svg fill="white" width="22" height="22" aria-hidden="true">
							<use href="#icon-show" xlink:href="#icon-show"></use>
						</svg>
					</button>
					<button class="btn btn--bright wish-btn" type="button" aria-label="许愿">
						<svg fill="white" width="22" height="22" aria-hidden="true">
							<use href="#icon-wish" xlink:href="#icon-wish"></use>
					</svg>
					</button>
				</div>
				<div class="menu hide">
					<div class="menu__inner-wrap">
						<button class="btn btn--bright close-menu-btn" type="button" aria-label="关闭设置">
							<svg fill="white" width="24" height="24" aria-hidden="true">
								<use href="#icon-close" xlink:href="#icon-close"></use>
							</svg>
						</button>
						<div class="menu__header">设置</div>
						<div class="menu__subheader">若想了解更多信息 请点击任意标签</div>
						<form>
							<div class="form-option form-option--select">
								<label class="shell-type-label"> 烟花类型 </label>
								<select class="shell-type"></select>
							</div>
							<div class="form-option form-option--select">
								<label class="shell-size-label"> 烟花大小 </label>
								<select class="shell-size"></select>
							</div>
							<div class="form-option form-option--select">
								<label class="quality-ui-label"> 画质 </label>
								<select class="quality-ui"></select>
							</div>
							<div class="form-option form-option--select">
								<label class="sky-lighting-label"> 照亮天空 </label>
								<select class="sky-lighting"></select>
							</div>
							<div class="form-option form-option--select">
								<label class="scaleFactor-label"> 缩放 </label>
								<select class="scaleFactor"></select>
							</div>
							<div class="form-option form-option--stacked">
								<label class="background-label"> 自定义背景 </label>
								<div class="form-option__content">
									<input class="background-input" type="text" placeholder="图片地址，或 linear-gradient(...)" autocomplete="off" spellcheck="false" />
									<div class="form-option__actions">
										<button class="background-apply-btn" type="button">应用</button>
										<button class="background-clear-btn" type="button">清除</button>
									</div>
									<div class="background-status" aria-live="polite"></div>
								</div>
							</div>
							<div class="form-option form-option--checkbox">
								<label class="word-shell-label"> 文字烟花 </label>
								<input class="word-shell" type="checkbox" />
							</div>
							<div class="form-option form-option--checkbox">
								<label class="auto-launch-label"> 自动放烟花 </label>
								<input class="auto-launch" type="checkbox" />
							</div>
							<div class="form-option form-option--checkbox form-option--finale-mode">
								<label class="finale-mode-label"> 同时放更多的烟花 </label>
								<input class="finale-mode" type="checkbox" />
							</div>
							<div class="form-option form-option--checkbox">
								<label class="hide-controls-label"> 隐藏控制按钮 </label>
								<input class="hide-controls" type="checkbox" />
							</div>
							<div class="form-option form-option--checkbox form-option--fullscreen">
								<label class="fullscreen-label"> 全屏 </label>
								<input class="fullscreen" type="checkbox" />
							</div>
							<div class="form-option form-option--checkbox">
								<label class="long-exposure-label"> 保留烟花的火花 </label>
								<input class="long-exposure" type="checkbox" />
							</div>
						</form>
						<div class="credits">
							<p class="copyright">
								Copyright&nbsp;&copy;&nbsp;2021 - <span class="copyright-year"></span>&nbsp;<a target="_blank" href="https://www.nianbroken.top/">碎念_Nian</a><br />All&nbsp;Rights&nbsp;Reserved
							</p>
						</div>
					</div>
				</div>
			</div>
			<div class="side-panel show-panel hide">
				<div class="side-panel__dialog">
					<button class="btn btn--bright side-panel__close-btn show-panel__close-btn" type="button" aria-label="关闭烟花秀编排">
						<svg fill="white" width="24" height="24" aria-hidden="true">
							<use href="#icon-close" xlink:href="#icon-close"></use>
						</svg>
					</button>
					<div class="side-panel__header">烟花秀编排</div>
					<div class="side-panel__subheader">在时间轴上编排节目，自动保存到本地</div>

					<div class="show-toolbar">
						<select class="show-select" aria-label="选择节目单"></select>
						<button class="panel-btn show-new-btn" type="button">新建</button>
						<button class="panel-btn show-delete-btn" type="button">删除</button>
					</div>
					<div class="show-name-row">
						<input class="show-name-input" type="text" maxlength="30" placeholder="节目单名称" autocomplete="off" spellcheck="false" />
						<button class="panel-btn show-save-btn" type="button">保存名称</button>
					</div>
					<div class="show-file-row">
						<button class="panel-btn show-export-btn" type="button">导出文件</button>
						<button class="panel-btn show-import-btn" type="button">导入文件</button>
						<input class="show-import-file" type="file" accept="application/json,.json" hidden />
					</div>

					<div class="show-total">总时长 <span class="show-total__value">00:00</span></div>

					<div class="show-program-list"></div>
					<div class="show-program-empty">还没有节目，在下方添加第一发烟花吧</div>

					<form class="program-add-form">
						<div class="program-form-title">添加节目</div>
						<div class="program-form-grid">
							<label class="program-field">
								<span>时间(秒)</span>
								<input class="program-time" type="number" min="0" step="0.1" value="0" inputmode="decimal" />
							</label>
							<label class="program-field">
								<span>类型</span>
								<select class="program-shell"></select>
							</label>
							<label class="program-field">
								<span>大小</span>
								<select class="program-size"></select>
							</label>
							<label class="program-field">
								<span>颜色</span>
								<select class="program-color"></select>
							</label>
							<label class="program-field program-field--range">
								<span>发射位置 <em class="program-position-value">50%</em></span>
								<input class="program-position" type="range" min="0" max="1" step="0.01" value="0.5" />
							</label>
							<label class="program-field program-field--range">
								<span>绽放高度 <em class="program-height-value">50%</em></span>
								<input class="program-height" type="range" min="0" max="1" step="0.01" value="0.5" />
							</label>
							<label class="program-field program-field--check">
								<span>文字烟花</span>
								<input class="program-use-word" type="checkbox" />
							</label>
							<label class="program-field program-field--word">
								<span>文字内容</span>
								<input class="program-word" type="text" maxlength="12" placeholder="最多 12 个字" disabled autocomplete="off" spellcheck="false" />
							</label>
						</div>
						<button class="panel-btn panel-btn--primary program-add-btn" type="submit">添加到时间轴</button>
					</form>

					<button class="panel-btn panel-btn--primary show-play-btn" type="button">播放烟花秀</button>
				</div>
			</div>

			<div class="side-panel wish-panel hide">
				<div class="side-panel__dialog">
					<button class="btn btn--bright side-panel__close-btn wish-panel__close-btn" type="button" aria-label="关闭许愿">
						<svg fill="white" width="24" height="24" aria-hidden="true">
							<use href="#icon-close" xlink:href="#icon-close"></use>
						</svg>
					</button>
					<div class="side-panel__header">许愿</div>
					<div class="side-panel__subheader">写下祝福，让它在夜空中绽放</div>
					<form class="wish-form">
						<input class="wish-input" type="text" maxlength="12" placeholder="输入祝福语（最多 12 个字）" autocomplete="off" spellcheck="false" />
						<button class="panel-btn panel-btn--primary wish-submit-btn" type="submit">放飞祝福</button>
					</form>
					<div class="wish-list-header">
						<span>祝福列表</span>
						<button class="panel-btn panel-btn--small wish-clear-btn" type="button">清空</button>
					</div>
					<div class="wish-list"></div>
					<div class="wish-empty">还没有祝福，快来许下第一个愿望吧</div>
				</div>
			</div>

			<div class="player-hud hide">
				<div class="player-hud__info">
					<div class="player-hud__title">
						<span class="player-hud__name"></span>
						<span class="player-hud__index"></span>
					</div>
					<div class="player-hud__bar">
						<div class="player-hud__progress-fill"></div>
					</div>
					<div class="player-hud__time">
						<span class="player-hud__elapsed">00:00</span>
						<span class="player-hud__total">00:00</span>
					</div>
				</div>
				<div class="player-hud__controls">
					<button class="panel-btn player-hud__pause-btn" type="button" aria-label="暂停或继续">
						<svg fill="white" width="20" height="20" aria-hidden="true">
							<use href="#icon-pause" xlink:href="#icon-pause"></use>
						</svg>
					</button>
					<button class="panel-btn player-hud__skip-btn" type="button" aria-label="跳过当前节目">
						<svg fill="white" width="20" height="20" aria-hidden="true">
							<use href="#icon-skip" xlink:href="#icon-skip"></use>
						</svg>
					</button>
					<button class="panel-btn player-hud__stop-btn" type="button" aria-label="停止播放">
						<svg fill="white" width="20" height="20" aria-hidden="true">
							<use href="#icon-stop" xlink:href="#icon-stop"></use>
						</svg>
					</button>
				</div>
			</div>

			<div class="help-modal">
				<div class="help-modal__overlay"></div>
				<div class="help-modal__dialog">
					<div class="help-modal__header"></div>
					<div class="help-modal__body"></div>
					<button type="button" class="help-modal__close-btn">关闭</button>
				</div>
			</div>
		</div>

		<!-- partial -->
		<script src="./js/lib/fscreen.js"></script>
		<script src="./js/lib/Stage.js"></script>
		<script src="./js/lib/MyMath.js"></script>
		<script src="./js/app/config.js"></script>
		<script src="./js/app/store.js"></script>
		<script src="./js/app/background-manager.js"></script>
		<script src="./js/app/shows.js"></script>
		<script src="./js/app/ui.js"></script>
		<script src="./js/fireworks/player.js"></script>
		<script src="./js/fireworks/show-ui.js"></script>
		<script src="./js/fireworks/runtime.js"></script>
		<script src="./js/fireworks/shells.js"></script>
		<script src="./js/fireworks/interaction.js"></script>
		<script src="./js/fireworks/simulation.js"></script>
		<script src="./js/fireworks/audio.js"></script>
		<script src="./js/fireworks/engine.js"></script>
	</body>
</html>
